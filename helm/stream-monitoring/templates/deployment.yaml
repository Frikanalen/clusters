apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stream-monitoring.name" . }}
  labels:
    {{- include "stream-monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "stream-monitoring.name" . }}
  template:
    metadata:
      labels:
        {{- include "stream-monitoring.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ffmpeg-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --input
            - {{ .Values.stream.url | quote }}
            - --metrics-port
            - "9090"
            - --probe-size
            - {{ .Values.stream.probeSize | quote }}
            - --analyze-duration
            - {{ .Values.stream.analyzeDuration | quote }}
          env:
            - name: RUST_LOG
              value: info
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

