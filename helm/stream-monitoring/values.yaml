image:
  repository: ghcr.io/domcyrus/ffmpeg_exporter
  tag: v2.0.0
  pullPolicy: IfNotPresent

stream:
  url: http://simula.frikanalen.no:9094/frikanalen.ts
  # Strings prevent YAML/Helm from rendering these CLI arguments in scientific notation.
  probeSize: "5000000"
  analyzeDuration: "5000000"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

