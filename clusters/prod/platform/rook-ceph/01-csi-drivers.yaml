apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-csi-drivers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  source:
    chart: ceph-csi-drivers
    helm:
      values: |
        operatorConfig:
          namespace: rook-ceph
          driverSpecDefaults:
            imageSet:
              name: rook-csi-operator-image-set-configmap
            nodePlugin:
              kubeletDirPath: /var/snap/microk8s/common/var/lib/kubelet
              priorityClassName: system-node-critical
            controllerPlugin:
              priorityClassName: system-cluster-critical

        drivers:
          rbd:
            enabled: true
            name: rook-ceph.rbd.csi.ceph.com
          cephfs:
            enabled: true
            name: rook-ceph.cephfs.csi.ceph.com
          nfs:
            enabled: false
            name: rook-ceph.nfs.csi.ceph.com
          nvmeof:
            enabled: false
            name: rook-ceph.nvmeof.csi.ceph.com
    repoURL: https://ceph.github.io/ceph-csi-operator
    targetRevision: 1.0.4
  destination:
    namespace: rook-ceph
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      limit: 10
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
