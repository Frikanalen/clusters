# Django's login on mail.frikanalen.tv (EMAIL_HOST_USER, EMAIL_HOST_PASSWORD).
# Edit the value in OpenBao (bao kv put kv/prod/default/django-smtp ...),
# not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: django-smtp
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: django-smtp
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: prod/default/django-smtp
