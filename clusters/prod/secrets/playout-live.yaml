# Copied into OpenBao unchanged by infra's playbooks/openbao_seed.yml; edit
# the value there (bao kv put kv/prod/default/playout-live ...), not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playout-live
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: playout-live
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: prod/default/playout-live
