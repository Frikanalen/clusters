# The shared secret GitHub signs push webhooks for this repo with, merged into
# Argo CD's own argocd-secret as webhook.github.secret. Only that one key:
# argocd-secret also holds Argo CD's admin password and session key, which
# this leaves alone. infra's roles/argocd_github_webhook generates the value
# in OpenBao; the GitHub webhook's "Secret" field must hold the same value:
#   bao kv get -field=secret kv/prod/argocd/argocd-webhook-github
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-github
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: prod/argocd/argocd-webhook-github
        property: secret
