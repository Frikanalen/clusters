# Copied into OpenBao unchanged by infra's playbooks/openbao_seed.yml; edit
# the value there (bao kv put kv/prod/default/pgcluster-app ...), not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgcluster-app
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pgcluster-app
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
    - extract:
        key: prod/default/pgcluster-app
