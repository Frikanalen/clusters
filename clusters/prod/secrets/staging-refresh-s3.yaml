# Garage key for the weekly prod -> staging database copy (bucket
# staging-refresh on file01), written to OpenBao by infra's roles/garage.
# This is prod's key, which can use that bucket only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staging-refresh-s3
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: staging-refresh-s3
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: prod/default/staging-refresh-s3
