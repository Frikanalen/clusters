apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default
  source:
    helm:
      values: |
        djangoUrl: https://frikanalen.tv/
        image:
          tag: v3.5.0
        ingress:
          className: public
          hostname: frikanalen.tv
    path: chart
    repoURL: https://github.com/Frikanalen/frontend.git
    targetRevision: v3.5.0
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
