apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/frontend.git"
    targetRevision: "v3.8.0"
    path: "chart"
    helm:
      values: |
        djangoUrl: https://frikanalen.tv/
        image:
          tag: v3.8.0
        ingress:
          className: public
          hostname: frikanalen.tv

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
