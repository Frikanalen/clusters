apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-api
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: ''
      jsonPointers:
      - /data
      kind: Secret
      name: django-secret
      namespace: default

  source:
    repoURL: "https://github.com/Frikanalen/django-api.git"
    targetRevision: "v3.12.1"
    path: "chart"
    helm:
      values: |
        env:
          ALLOWED_HOSTS: frikanalen.tv,.pod.cluster.local,django-api.default.svc.cluster.local
          CSRF_TRUSTED_ORIGINS: https://frikanalen.tv
          # Recordings on request (recordings app): MediaMTX's playback server
          # and ingest's upload pod, which archives each recording.
          FK_MEDIAMTX_API_URL: http://mediamtx-api.default.svc.cluster.local:9997
          FK_MEDIAMTX_PLAYBACK_URL: http://mediamtx-playback.default.svc.cluster.local:9996
          FK_INGEST_INTERNAL_URL: http://ingest-upload.default.svc.cluster.local:8000
          FK_MEDIAMTX_RTMP_URL: rtmp://frikanalen.tv:1935
          FK_MEDIAMTX_RTSP_URL: rtsp://frikanalen.tv:8554
          FK_MEDIAMTX_SRT_URL: srt://frikanalen.tv:8890
          FK_MEDIAMTX_WEBRTC_URL: https://frikanalen.tv
          FK_MEDIA_URLPREFIX: https://frikanalen.tv/media/
          FK_UPLOAD_URL: https://frikanalen.tv/upload
          # Real mail through mailcow's submission port; login from OpenBao
          # (email.secret below).
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: mail.frikanalen.tv
          EMAIL_PORT: "587"
          EMAIL_USE_TLS: "true"
          DEFAULT_FROM_EMAIL: Frikanalen <noreply@frikanalen.tv>
        ingress:
          className: public
          enabled: true
          hostname: frikanalen.tv
        monitoring:
          enabled: true
          interval: 30s
          scrapeTimeout: 10s
        # Encrypts pulled live sources' addresses; from OpenBao.
        pullUrlKeys:
          secret: django-pull-url-keys
        # SMTP login on mail.frikanalen.tv; from OpenBao.
        email:
          secret: django-smtp
        # Keeps Stortinget's sittings on air (Tue/Wed), Democracy Now! 14-15
        # in an emptied hall, and the EU Commission's midday briefing on the
        # days EbS lists one (stortinget/keeper.py).
        stortingetKeeper:
          enabled: true
          dryRun: false
          liveSourceId: 39
          democracyNow:
            liveSourceId: 38
          euBriefing:
            liveSourceId: 5
          # Records Democracy Now! 14-15 every weekday and reruns it at 20:00
          # when that hour is free.
          democracyNowRerun:
            at: "20:00"
        # Keeps MediaMTX recording what has been requested (recordings app).
        recordingKeeper:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ignoreDifferences alone only hides a field from the diff: the next
      # sync, which every image bump starts, still applies the rendered value
      # over it. django-api's chart renders a fresh random SECRET_KEY each
      # time (Helm's lookup is always empty under Argo CD), so without this
      # every rollout replaced the key and logged everyone out.
      - RespectIgnoreDifferences=true
