apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-api
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: ''
      jsonPointers:
      - /data
      kind: Secret
      name: django-secret
      namespace: default

  source:
    repoURL: "https://github.com/Frikanalen/django-api.git"
    targetRevision: "v3.0.0"
    path: "chart"
    helm:
      values: |
        django:
          image:
            repository: ghcr.io/frikanalen/django-api
            tag: v3.0.0
        env:
          ALLOWED_HOSTS: frikanalen.tv,.pod.cluster.local,django-api.default.svc.cluster.local
          CSRF_TRUSTED_ORIGINS: https://frikanalen.tv
          FK_MEDIAMTX_RTMP_URL: rtmp://frikanalen.tv:1935
          FK_MEDIAMTX_RTSP_URL: rtsp://frikanalen.tv:8554
          FK_MEDIAMTX_SRT_URL: srt://frikanalen.tv:8890
          FK_MEDIAMTX_WEBRTC_URL: https://frikanalen.tv
          FK_MEDIA_URLPREFIX: https://frikanalen.tv/media/
          FK_UPLOAD_URL: https://frikanalen.tv/upload
        ingress:
          className: public
          enabled: true
          hostname: frikanalen.tv
        monitoring:
          enabled: true
          interval: 30s
          scrapeTimeout: 10s

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ignoreDifferences alone only hides a field from the diff: the next
      # sync, which every image bump starts, still applies the rendered value
      # over it. django-api's chart renders a fresh random SECRET_KEY each
      # time (Helm's lookup is always empty under Argo CD), so without this
      # every rollout replaced the key and logged everyone out.
      - RespectIgnoreDifferences=true
