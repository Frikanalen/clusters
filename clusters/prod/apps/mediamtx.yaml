apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediamtx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/contribution-receiver.git"
    targetRevision: "88640e6c619076759aa5acbc505463796baa5583"
    path: "chart"
    helm:
      values: |
        authURL: http://django-api.default.svc.cluster.local:8080/api/mediamtx/auth
        monitoring:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            scrapeTimeout: 10s
        preview:
          enabled: 'true'
        service:
          loadBalancerIP: 192.168.3.107
        webrtc:
          additionalHosts:
          - frikanalen.tv
          - 192.168.3.107
          enabled: true
          hostname: frikanalen.tv
          ingressClassName: public
        writeQueueSize: 4096

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
