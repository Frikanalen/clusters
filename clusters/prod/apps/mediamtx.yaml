# Still the chart in this repo (helm/mediamtx), as infra deployed it.
# Staging has moved to Frikanalen/contribution-receiver; prod follows in its
# own change.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediamtx
  namespace: argocd
spec:
  project: default
  source:
    helm:
      values: |
        authURL: http://django-api.default.svc.cluster.local:8080/api/mediamtx/auth
        monitoring:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            scrapeTimeout: 10s
        preview:
          enabled: 'true'
        service:
          loadBalancerIP: 192.168.3.107
        webrtc:
          additionalHosts:
          - frikanalen.tv
          - 192.168.3.107
          enabled: true
          hostname: frikanalen.tv
          ingressClassName: public
        writeQueueSize: 4096
    path: helm/mediamtx
    repoURL: https://github.com/Frikanalen/gitops.git
    targetRevision: main
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
