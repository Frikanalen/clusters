apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediamtx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/contribution-receiver.git"
    targetRevision: "main"
    path: "chart"
    helm:
      values: |
        authURL: http://django-api.default.svc.cluster.local:8080/api/mediamtx/auth
        # Django adds recording paths and reads signal through the API.
        api:
          enabled: true
        # Recordings on request: Django adds contrib/record/<id> paths, ingest
        # fetches them from the playback server (mediamtx-playback:9996).
        recording:
          enabled: true
          storageClassName: ceph-rbd
        # Pulled live sources (contribution-receiver chart, "Pulled sources").
        pull:
          enabled: true
          credentialSecret: mediamtx-pull
        # Keeps the pull relay from reaching the cluster or the LAN.
        networkPolicy:
          enabled: true
        monitoring:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            scrapeTimeout: 10s
        preview:
          enabled: 'true'
        service:
          loadBalancerIP: 192.168.3.107
        webrtc:
          additionalHosts:
          - frikanalen.tv
          - 192.168.3.107
          enabled: true
          hostname: frikanalen.tv
          ingressClassName: public
        writeQueueSize: 4096

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
