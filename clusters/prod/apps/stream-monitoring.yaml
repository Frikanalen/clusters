apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stream-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/stream-monitoring.git"
    targetRevision: "3f8475d1cee654fe3a35ccdcf4f726a865301534"
    path: "chart"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
