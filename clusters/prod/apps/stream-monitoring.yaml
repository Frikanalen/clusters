apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stream-monitoring
  namespace: argocd
spec:
  project: default
  source:
    path: helm/stream-monitoring
    repoURL: https://github.com/Frikanalen/gitops.git
    targetRevision: main
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
