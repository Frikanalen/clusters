apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stream-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/stream-monitoring.git"
    targetRevision: "v0.3.0"
    path: "chart"
    helm:
      values: |
        # The MPEG-TS monitor (tsMonitor, on by default) watches
        # frikanalen.ts. These add what staging has run since 2026-11-13:
        # a player-like probe of the public HLS (default URL is
        # frikanalen.tv's) and alerts on the packager's own pods.
        hlsProbe:
          enabled: true
        packagerAlerts:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
