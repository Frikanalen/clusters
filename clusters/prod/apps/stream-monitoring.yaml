apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stream-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/stream-monitoring.git"
    targetRevision: "3c27f7f24a24d0ff0574d949c58a1d7e1e2b08f2"
    path: "chart"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
