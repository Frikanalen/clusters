apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: frontend
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "frontend"
      images:
        - alias: frontend
          imageName: "ghcr.io/frikanalen/frontend:claude-project-thread-c44uwy"
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
          commonUpdateSettings:
            updateStrategy: digest
      writeBackConfig:
        method: argocd
