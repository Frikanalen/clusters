apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: graphics
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "graphics"
      images:
        - alias: graphics
          imageName: "ghcr.io/frikanalen/graphics:main"
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
          commonUpdateSettings:
            updateStrategy: digest
      writeBackConfig:
        method: argocd
