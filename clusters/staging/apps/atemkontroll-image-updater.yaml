apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: atemkontroll
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "atemkontroll"
      images:
        - alias: atemkontroll
          imageName: "ghcr.io/frikanalen/atemkontroll:main"
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
          commonUpdateSettings:
            updateStrategy: digest
      writeBackConfig:
        method: argocd
