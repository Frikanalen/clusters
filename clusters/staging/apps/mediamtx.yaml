apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediamtx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/contribution-receiver.git"
    targetRevision: "main"
    path: "chart"
    helm:
      values: |
        authURL: http://django-api.default.svc.cluster.local:8080/api/mediamtx/auth
        # Django reads what signal each source receives (signal reports).
        api:
          enabled: true
        # Pulled live sources (contribution-receiver chart, "Pulled sources").
        pull:
          enabled: true
          credentialSecret: mediamtx-pull
        networkPolicy:
          enabled: true
        monitoring:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            scrapeTimeout: 10s
        preview:
          enabled: true
        service:
          loadBalancerIP: 192.168.3.93
        webrtc:
          additionalHosts:
          - staging.frikanalen.tv
          - 192.168.3.93
          enabled: true
          hostname: staging.frikanalen.tv
          ingressClassName: public
        writeQueueSize: 4096

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
