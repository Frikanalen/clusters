apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teletext
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/teletext.git"
    # Staging follows main, like its other apps. Needs teletext#14.
    targetRevision: "main"
    path: "chart"
    helm:
      values: |
        image:
          tag: main
          pullPolicy: Always
        # Publisher tokens: kv/staging/teletext/ttxd-tokens, keys pages and subtitles.
        tokens:
          externalSecret:
            key: staging/teletext/ttxd-tokens
        # ttx-inject on sdi-test1 connects here (infra data/hosts.yml,
        # ingress-dev-teletext; MetalLB extra address in k8s_platform_dev.yml).
        link:
          service:
            loadBalancerIP: 192.168.3.94
        # The web teletext viewer's read-only feed, at /teletext/ on the site
        # (needs teletext#16).
        public:
          enabled: true
          ingress:
            enabled: true
            hostname: staging.frikanalen.tv
        persistence:
          storageClass: ceph-rbd
        # The studio page generator (teletext#15). :latest until a release
        # carries the ttx-pages image.
        pages:
          enabled: true
          image:
            tag: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: teletext
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
