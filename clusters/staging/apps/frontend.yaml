apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/frontend.git"
    targetRevision: "claude/project-thread-1c8lwy"
    path: "chart"
    helm:
      values: |
        djangoUrl: https://staging.frikanalen.tv/
        image:
          # The redesign branch (Frikanalen/frontend#99); slashes become
          # dashes in image tags. Set both back to main to revert.
          tag: claude-project-thread-1c8lwy
        ingress:
          className: public
          hostname: staging.frikanalen.tv

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
