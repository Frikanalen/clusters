apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: playout
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "playout"
      images:
        - alias: playout
          imageName: "ghcr.io/frikanalen/playout:main"
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
          commonUpdateSettings:
            updateStrategy: digest
      writeBackConfig:
        method: argocd
