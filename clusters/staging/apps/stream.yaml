apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stream
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/live-stream-packager.git"
    targetRevision: "main"
    path: "."
    helm:
      values: |
        cubemap:
          enabled: true
          hostNetwork: true
          loadBalancerIP: 192.168.3.91
          multicastGroup: 239.1.1.50
        ffmpeg:
          inputSourceUrl: http://192.168.3.1:9094/frikanalen.ts
        ingress:
          host: staging.frikanalen.tv
        # The chart's own resources: the transcoder requests the 5 CPU its
        # two x264 encodes use. Staging asked for 1 until 2026-11-13, when an
        # ingest worker beside it took the node and the stream came apart.
        priorityClass:
          name: stream-critical
          create: true

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
