apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stream
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/live-stream-packager.git"
    targetRevision: "main"
    path: "."
    helm:
      values: |
        cubemap:
          enabled: true
          hostNetwork: true
          loadBalancerIP: 192.168.3.91
          multicastGroup: 239.1.1.50
        ffmpeg:
          inputSourceUrl: http://192.168.3.1:9094/frikanalen.ts
        ingress:
          host: staging.frikanalen.tv
        resources:
          ffmpeg:
            limits:
              cpu: '6'
            requests:
              cpu: '1'

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
