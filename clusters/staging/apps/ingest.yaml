apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/ingest.git"
    targetRevision: "main"
    path: "chart"
    helm:
      values: |
        api:
          secretName: ingest-api
          url: https://staging.frikanalen.tv
        archive:
          dir: /archive/media-staging
          mount:
            existingClaim: ingest-archive
            nfs:
              path: /archive/media-staging
              server: file01
          ssh:
            enabled: true
            host: file01
            port: 22
            required: true
            secretName: ingest-archive-ssh
            username: ingest-staging
        image:
          repository: ghcr.io/frikanalen/ingest
          tag: main
        ingress:
          certResolver: letsencrypt
          className: public
          enabled: true
          hostname: staging.frikanalen.tv
        tusd:
          basePath: /upload
        uploads:
          # clusters/staging/volumes/ingest-uploads.yaml
          existingClaim: ingest-uploads-media
        workers:
          pools: {}
          replicaCount: 4
          # Never beside the live stream: a worker has no CPU limit, and on
          # 2026-11-13 one starved the stream's transcoder for hours.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  namespaceSelector: {}
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: live-stream-packager
          # Scratch on each node's local disk rather than its root disk,
          # which a large source could fill.
          work:
            volume:
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    storageClassName: local-ssd
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests:
                        storage: 25Gi
          resources:
            limits:
              memory: 16Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
