apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Frikanalen/ingest.git"
    targetRevision: "main"
    path: "chart"
    helm:
      values: |
        api:
          secretName: ingest-api
          url: https://staging.frikanalen.tv
        archive:
          dir: /archive/media-staging
          mount:
            existingClaim: ingest-archive
            nfs:
              path: /archive/media-staging
              server: file01
          ssh:
            enabled: true
            host: file01
            port: 22
            required: true
            secretName: ingest-archive-ssh
            username: ingest-staging
        image:
          repository: ghcr.io/frikanalen/ingest
          tag: main
        ingress:
          certResolver: letsencrypt
          className: public
          enabled: true
          hostname: staging.frikanalen.tv
        tusd:
          basePath: /upload
        uploads:
          # clusters/staging/volumes/ingest-uploads.yaml
          existingClaim: ingest-uploads-media
        workers:
          pools: {}
          # Three, not four: one of the four nodes is the stream's, and the
          # workers' spread constraint would leave a fourth Pending.
          replicaCount: 3
          # Never beside the live stream: on 2026-11-13 a worker without a
          # CPU limit starved the stream's transcoder for hours.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  namespaceSelector: {}
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: live-stream-packager
          # Scratch on each node's local disk rather than its root disk,
          # which a large source could fill.
          work:
            volume:
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    storageClassName: local-ssd
                    accessModes: [ReadWriteOnce]
                    resources:
                      requests:
                        storage: 25Gi
          # A CPU limit as well: during a re-encode backlog (2026-11-23/24)
          # the three workers took up to 16 cores each, pinning dev-kube-1
          # at 98% and keeping the node saturation alerts flapping. Staging
          # transcodes may as well be slow; the cluster also runs the
          # stream, playout and everything else being tested.
          resources:
            limits:
              cpu: "4"
              memory: 16Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
