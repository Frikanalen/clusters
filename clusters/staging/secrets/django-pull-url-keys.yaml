# Written to OpenBao by infra's k8s_apps_staging.yml (--tags pull_sources);
# see roles/pull_url_keys. Edit the value there
# (bao kv put kv/staging/default/django-pull-url-keys ...), not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: django-pull-url-keys
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: django-pull-url-keys
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: staging/default/django-pull-url-keys
