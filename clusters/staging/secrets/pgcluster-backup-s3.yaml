# Copied into OpenBao unchanged by infra's playbooks/openbao_seed.yml; edit
# the value there (bao kv put kv/staging/default/pgcluster-backup-s3 ...), not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgcluster-backup-s3
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pgcluster-backup-s3
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: staging/default/pgcluster-backup-s3
