# Copied into OpenBao unchanged by infra's playbooks/openbao_seed.yml; edit
# the value there (bao kv put kv/staging/default/ingest-api ...), not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingest-api
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ingest-api
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: staging/default/ingest-api
