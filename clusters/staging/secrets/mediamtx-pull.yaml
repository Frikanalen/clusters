# Written to OpenBao by infra's k8s_apps_staging.yml (--tags pull_sources);
# see roles/pull_relay_secret. Edit the value there
# (bao kv put kv/staging/default/mediamtx-pull ...), not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediamtx-pull
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mediamtx-pull
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: staging/default/mediamtx-pull
