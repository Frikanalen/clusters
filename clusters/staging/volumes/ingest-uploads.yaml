# Ingest's upload volume (tusd's partial uploads and anything not yet
# archived), on dev-kube-4's local disk: vmtx1's HDD array, sized by
# local_ssd_size in the infra repo's data/hosts.yml. Off the node's root
# disk, where microk8s-hostpath used to put it.
#
# selected-node is what the scheduler would set for a WaitForFirstConsumer
# claim; setting it here makes local-path provision on dev-kube-4, and the
# PV's node affinity then keeps the ingest pod there.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ingest-uploads-local
  namespace: default
  annotations:
    volume.kubernetes.io/selected-node: dev-kube-4
spec:
  storageClassName: local-ssd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
