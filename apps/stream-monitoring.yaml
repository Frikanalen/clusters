apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stream-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Frikanalen/gitops.git
    targetRevision: main
    path: helm/stream-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

